# Interface in English, notes in Chinese.
title: Yen Lai
description: Yen Lai, a product manager in Taiwan, writes about how products get decided. 關於產品決策的中文筆記。
url: https://laiyenju.github.io
author:
  name: Yen Lai
  twitter: theYenLai
# Share card when a page has none of its own (see scripts/og/).
og_image: /assets/og/home.jpg
lang: zh-Hant
timezone: Asia/Taipei

# Only index.md + published/ become site pages.
# Root drafts use the *.draft.md naming convention (see README).
include:
  - published

exclude:
  - README.md
  - node_modules
  - _site
  - .jekyll-cache
  - "*.draft.md"
  - assets/vendor
  - scripts
  - assets/og/manifest.json

defaults:
  - scope:
      path: ""
    values:
      layout: default
