title: Yen 的寫作
description: Yen Lai 的個人寫作網站
lang: zh-Hant
timezone: Asia/Taipei

# Only index.md + published/ become site pages.
# Root drafts use the *.draft.md naming convention (see README).
include:
  - published

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - _site
  - .jekyll-cache
  - "*.draft.md"
  - assets/vendor

defaults:
  - scope:
      path: "published"
    values:
      layout: default
  - scope:
      path: ""
    values:
      layout: default
