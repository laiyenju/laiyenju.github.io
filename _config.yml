title: Yen 的寫作
description: Yen Lai 的個人寫作網站
url: https://laiyenju.github.io
author:
  name: Yen Lai
  twitter: theYenLai
# Share card for every page (source: assets/images/og.html).
og_image: /assets/images/og.jpg
og_image_alt: 墨藍浪頭中躍起的朱色錦鯉，木刻版畫風格，旁邊寫著 hey, I'm Yen
lang: zh-Hant
timezone: Asia/Taipei

# Only index.md + published/ become site pages.
# Root drafts use the *.draft.md naming convention (see README).
include:
  - published

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - _site
  - .jekyll-cache
  - "*.draft.md"
  - assets/vendor
  - assets/images/og.html

defaults:
  - scope:
      path: "published"
    values:
      layout: default
  - scope:
      path: ""
    values:
      layout: default
