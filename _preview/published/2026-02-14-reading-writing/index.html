              <p>這一頁先放著，用來預覽標題層級與段落節奏。假文——之後再換成真正想讀的文章。<sup id="fnref:1"><a href="#fn:1" class="footnote" rel="footnote">1</a></sup></p>

              <p>留白比裝飾重要。一行、再一行。假文佔位，夠長就可以檢查捲動與揭示。</p>
