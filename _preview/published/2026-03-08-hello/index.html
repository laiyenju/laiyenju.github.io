              <p>這是一篇關於寫作的練習。文字慢慢成形。安靜比裝飾更重要。</p>
              <p>字與空，一行一行落地。路徑放在發布資料夾裡。假文佔位——用來預覽標題、正文與側欄註腳，不是正式稿。<sup id="fnref:1"><a href="#fn:1" class="footnote" rel="footnote">1</a></sup></p>
              <h2>小標</h2>
              <p>再往下多幾段，方便感受行距與漢字尺碼。留白比裝飾重要；琥珀細線只輕觸一下日期。</p>
              <p>假文繼續：閱讀的速度可以慢下來。光標一閃一閃，像還在寫。</p>

                <li id="fn:1">側欄。窄螢幕改文末。<a href="#fnref:1" class="reversefootnote">&#8617;</a></li>
