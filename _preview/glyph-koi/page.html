<title>字根錦鯉</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600&display=swap">
<style>
  /* Layout: a quiet frame around three live specimens — day and night side by side, today's version below. */
  :root {
    --bg: #f3f1ec;
    --fg: #23201c;
    --muted: #6f675e;
    --line: rgba(35, 32, 28, 0.14);
    --chip: #e8e4dc;
    --accent: #b8332a;
    --paper: #fafaf7;
    --ink: #1d1813;
    --night: #14110d;
    --amber: #f2bd6b;
    --font-ui: "Noto Sans TC", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --font-mincho: "Noto Serif TC", "Songti TC", serif;
    --font-dot: "DotGothic16", "Noto Sans TC", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e0c; --fg: #ece6dc; --muted: #9b9286; --line: rgba(236, 230, 220, 0.14); --chip: #1d1b18; --accent: #e0675c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0e0c; --fg: #ece6dc; --muted: #9b9286; --line: rgba(236, 230, 220, 0.14); --chip: #1d1b18; --accent: #e0675c;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.65 var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
  }
  .wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 20px; }

  header { display: grid; gap: 6px; }
  h1 { margin: 0; font: 600 26px/1.3 var(--font-mincho); text-wrap: balance; }
  h1 small { font: 400 13px var(--font-mono); color: var(--muted); margin-left: 10px; letter-spacing: 0.04em; }
  .lede { margin: 0; max-width: 66ch; color: var(--muted); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls label {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip);
    font: 13px var(--font-mono); user-select: none;
  }
  .controls input { accent-color: var(--accent); margin: 0; }
  .controls label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font: 12px var(--font-mono); color: var(--muted); }

  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  .grid .wide { grid-column: 1 / -1; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

  figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
  figcaption { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  figcaption b { font: 600 13px var(--font-mono); letter-spacing: 0.06em; }
  figcaption span { font-size: 13px; color: var(--muted); }

  .stage {
    position: relative; overflow: hidden; border-radius: 4px;
    height: clamp(420px, 68vh, 640px);
    border: 1px solid var(--line);
  }
  .wide .stage { height: clamp(320px, 48vh, 460px); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(86%, 380px); pointer-events: none; z-index: 2;
  }
  .copy p { margin: 0; }
  .copy .g { font-size: 26px; line-height: 1.25; margin-bottom: 8px; }
  .copy .s { font-size: 14px; opacity: 0.75; }

  /* A · today's site */
  .now { background: var(--paper); color: #2a2420; }
  .now canvas { font-family: var(--font-mono); }
  .now .g { font-family: var(--font-mono); font-weight: 600; letter-spacing: -0.02em; }
  .now .s { font-family: var(--font-mono); }

  /* B · day: movable type on paper */
  .day { background: var(--paper); color: var(--ink); }
  .day .g { font-family: var(--font-mincho); font-weight: 600; }
  .day .s { font-family: var(--font-mincho); }
  .day .seal {
    display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; margin-left: 0.25em;
    background: #b8332a; color: #f6efe4; font-size: 0.7em; vertical-align: 0.15em; border-radius: 2px;
  }

  /* C · night: amber phosphor terminal */
  .night { background: var(--night); color: var(--amber); }
  .night canvas { filter: drop-shadow(0 0 3px rgba(242, 176, 80, 0.45)); }
  .night::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, 0.18) 2px 3px);
  }
  .night .copy { text-shadow: 0 0 6px rgba(242, 176, 80, 0.55); }
  .night .g { font-family: var(--font-dot); }
  .night .s { font-family: var(--font-dot); }
  .night .cursor { display: inline-block; width: 0.55em; height: 1em; background: currentColor; vertical-align: -0.12em; margin-left: 0.15em; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .night .cursor { animation: none; } }

  .spec { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .spec div { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 2px; min-width: 0; }
  .spec dt { font: 12px var(--font-mono); color: var(--muted); letter-spacing: 0.04em; }
  .spec dd { margin: 0; font: 600 20px/1.4 var(--font-mincho); letter-spacing: 0.12em; overflow-wrap: anywhere; }
  .spec dd em { font: 400 12px var(--font-mono); font-style: normal; color: var(--muted); letter-spacing: 0; }
</style>

<div class="wrap">
  <header>
    <h1>字根錦鯉 <small>glyph koi · prototype</small></h1>
    <p class="lede">同一個游魚引擎，換掉字元和顏色。B 和 C 用倉頡字根畫錦鯉：亮處筆畫少，暗處筆畫多；邊緣散成單一筆畫；紅斑是印章格。滑鼠移過去錦鯉會閃開，點一下有水波。</p>
  </header>

  <div class="controls">
    <label><input type="checkbox" id="opt-fish"> 加入小魚群（注音）</label>
    <label><input type="checkbox" id="opt-grid" checked> 顯示格線</label>
    <span class="hint">小魚在 A 是「-」，在 B、C 是 ㄅㄆㄇㄈ</span>
  </div>

  <div class="grid">
    <figure>
      <figcaption><b>B · 日間</b><span>鉛字印在紙上：明體字根，朱砂印章紅</span></figcaption>
      <div class="stage day">
        <canvas data-theme-key="GLYPH_DAY" aria-hidden="true"></canvas>
        <div class="copy"><p class="g">hey, I'm Yen.<span class="seal">寫</span></p><p class="s">I build things, then make sense of them.</p></div>
      </div>
    </figure>
    <figure>
      <figcaption><b>C · 夜間</b><span>琥珀磷光終端機：點陣字根，紅斑改成反白</span></figcaption>
      <div class="stage night">
        <canvas data-theme-key="GLYPH_NIGHT" aria-hidden="true"></canvas>
        <div class="copy"><p class="g">hey, I'm Yen.<span class="cursor"></span></p><p class="s">I build things, then make sense of them.</p></div>
      </div>
    </figure>
    <figure class="wide">
      <figcaption><b>A · 現在的版本</b><span>對照組：原本的 ASCII 字元和色塊</span></figcaption>
      <div class="stage now">
        <canvas data-theme-key="ASCII" aria-hidden="true"></canvas>
        <div class="copy"><p class="g">hey, I'm Yen.</p><p class="s">I build things, then make sense of them.</p></div>
      </div>
    </figure>
  </div>

  <dl class="spec">
    <div><dt>身體 · 亮 → 暗</dt><dd>一卜人十大口日田金</dd></div>
    <div><dt>鰭 · 背脊 · 眼</dt><dd>心水手火月 · 山土弓 · 目</dd></div>
    <div><dt>邊緣與尾扇 · 單一筆畫</dt><dd>丶丿乀乙 <em>（筆鋒離開紙面）</em></dd></div>
    <div><dt>小魚 · 咬痕</dt><dd>ㄅㄆㄇㄈㄉㄊ · 米。</dd></div>
  </dl>
</div>

<script>/*GLYPH_OCEAN*/</script>
<script>
  (function () {
    var canvases = Array.prototype.slice.call(document.querySelectorAll("canvas[data-theme-key]"));
    var fish = document.getElementById("opt-fish");
    var grid = document.getElementById("opt-grid");
    var engines = [];

    function start() {
      engines.forEach(function (e) { e.destroy(); });
      engines = canvases.map(function (c) {
        var theme = window.GlyphThemes[c.getAttribute("data-theme-key")];
        // fishCount 0 matches the live home page; undefined lets the engine size the schools to the panel.
        var e = new window.GlyphOcean(c, undefined, fish.checked ? undefined : 0, theme);
        e.setGrid(grid.checked);
        return e;
      });
    }

    fish.addEventListener("change", start);
    grid.addEventListener("change", function () {
      engines.forEach(function (e) { e.setGrid(grid.checked); });
    });
    // Wait for the mincho and dot faces so the first frames don't draw in a fallback.
    var sample = "一卜人十大口日田金心水手火月山土弓目丶丿乀乙ㄅㄆㄇ";
    Promise.all([
      document.fonts.load('600 16px "Noto Serif TC"', sample),
      document.fonts.load('400 16px "DotGothic16"', sample),
      document.fonts.load('600 16px "JetBrains Mono"', "@#%"),
    ]).catch(function () {}).then(start);
  })();
</script>
