<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, I'm Yen</title>
<meta name="description" content="Yen Lai 的個人寫作網站">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="lang-zh-Hant home">
  <div class="home-stage">
    <canvas data-koi class="home-puffer" aria-hidden="true"></canvas>
    <div class="home-vignette" aria-hidden="true"></div>

    <header class="home-nav" role="navigation" aria-label="Primary">
      <a href="notes/">notes</a>
      <a href="works/">works</a>
      <a href="about/">about</a>
    </header>

    <div class="home-chrome">
      <div class="home-dim" aria-hidden="true"></div>
      <div class="home-copy">
        <h1 class="home-greeting">Hello, I'm Yen</h1>
        <p class="home-sub">寫作 · notes &amp; works</p>
        <p class="home-slogan">A quiet place for notes and works. Living ASCII 錦鯉 as the homepage main visual — paper ground, sparse forms, type always readable.</p>
        <p class="home-contact"><a href="mailto:yenju.lai@proton.me">Contact →</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/ocean.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var el = document.querySelector("canvas[data-koi]");
      if (el && window.OceanEngine) new window.OceanEngine(el);
      var roots = document.querySelectorAll(".home-nav, .home-copy");
      roots.forEach(function (root) {
        var texts = [];
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        var node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue && node.nodeValue.trim()) texts.push(node);
        }
        texts.forEach(function (textNode) {
          var frag = document.createDocumentFragment();
          var value = textNode.nodeValue;
          for (var i = 0; i < value.length; i++) {
            var ch = value.charAt(i);
            if (ch === " " || ch === "\n" || ch === "\t") {
              frag.appendChild(document.createTextNode(ch));
            } else {
              var span = document.createElement("span");
              span.className = "home-glyph";
              span.textContent = ch;
              frag.appendChild(span);
            }
          }
          textNode.parentNode.replaceChild(frag, textNode);
        });
      });
      var glyphs = document.querySelectorAll(".home-glyph");
      function fishAt(data, w, x, y) {
        if (x < 1 || y < 1 || x >= w - 1) return false;
        for (var dy = -1; dy <= 1; dy++) {
          for (var dx = -1; dx <= 1; dx++) {
            var i = ((y + dy) * w + (x + dx)) * 4;
            var r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
            if (a < 200) continue;
            var warm = r > g + 22 && r > 120 && g < 200;
            var deep = r < 72 && g < 64 && b < 60;
            if (warm || deep) return true;
          }
        }
        return false;
      }
      function tick() {
        var canvas = document.querySelector("canvas[data-koi]");
        if (canvas) {
          var ctx = canvas.getContext("2d");
          var crect = canvas.getBoundingClientRect();
          if (ctx && crect.width > 0) {
            var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            var sx = canvas.width / crect.width;
            var sy = canvas.height / crect.height;
            for (var i = 0; i < glyphs.length; i++) {
              var g = glyphs[i];
              var r = g.getBoundingClientRect();
              var x = Math.round((r.left + r.width / 2 - crect.left) * sx);
              var y = Math.round((r.top + r.height / 2 - crect.top) * sy);
              g.style.color = fishAt(data, canvas.width, x, y) ? "#FFF5EB" : "";
            }
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
