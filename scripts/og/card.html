<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>share card</title>
<!--
  The share card (1200 × 630), one per note plus one for home. build.js opens this page, calls render(data)
  and saves a screenshot to assets/og/.
  A postcard from that day. The picture side (left): the building the home page showed on the note's date,
  drawn with the site's own models (assets/js/scenes.js) in that afternoon's light: the office on a weekday,
  home on a rest day. The writing side (right): a stamp, a postmark with the city and the date, the command
  that prints the note, its title and opening words, and the return address. Flat, in the site's colours.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;700&display=block" rel="stylesheet">
<style>
  @font-face { font-family: "iA Writer Quattro"; src: url("../../assets/fonts/quattro/iAWriterQuattroS-Bold.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "iA Writer Quattro"; src: url("../../assets/fonts/quattro/iAWriterQuattroS-Regular.woff2") format("woff2"); font-weight: 400; }
  :root {
    --paper: #f8f8f5; --ink: #262421; --soft: #5a544e; --faint: #736d66; --accent: #b5531e; --rule: rgba(38, 36, 33, .16);
    --mono: "JetBrains Mono", "Noto Sans TC", monospace;
    --sans: "iA Writer Quattro", "Noto Sans TC", sans-serif;
  }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 620px 1px 1fr; }

  /* the picture side */
  .pic { position: relative; overflow: hidden; }
  .pic canvas { image-rendering: pixelated; display: block; position: absolute; }
  .pic .cap { position: absolute; left: 56px; bottom: 44px; font: 400 17px/1.4 var(--mono); color: var(--faint); letter-spacing: .02em; }

  /* the postcard's middle line */
  .split { background: var(--rule); margin: 64px 0; }

  /* the writing side */
  .back { position: relative; padding: 56px 60px 48px 44px; display: flex; flex-direction: column; }
  .stamp {
    position: absolute; top: 48px; right: 56px; width: 116px; height: 138px; box-sizing: border-box; padding: 9px;
    /* a perforated edge: the paper bites half circles out of the stamp's rim */
    background: radial-gradient(circle, var(--paper) 3.4px, transparent 3.9px) -5px -5px / 10px 10px, var(--sheet, #fff);
  }
  .stamp .in { width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: var(--stamp); color: var(--paper); padding-bottom: 7px; overflow: hidden; }
  .stamp canvas { image-rendering: pixelated; margin-bottom: auto; margin-top: 8px; }
  .stamp .city { font: 600 12px/1 var(--mono); letter-spacing: .14em; }
  /* the postmark only bites the stamp's edge, so its date stays readable */
  .mark { position: absolute; top: 70px; right: 140px; width: 280px; height: 128px; color: var(--ink); opacity: .55; transform: rotate(-6deg); }
  .mark text { font: 500 12px var(--mono); letter-spacing: .14em; fill: currentColor; }
  .mark .day { font: 600 14px var(--mono); letter-spacing: .02em; }

  .msg { margin-top: 186px; }
  .cmd { margin: 0; font: 400 18px/1.4 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd i { font-style: normal; color: var(--accent); }
  h1 { margin: 14px 0 0; font: 700 40px/1.3 var(--sans); letter-spacing: -.005em; text-wrap: balance;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .sum { margin: 14px 0 0; font: 400 21px/1.6 var(--sans); color: var(--soft);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .addr { margin-top: auto; display: grid; gap: 14px; font: 400 18px/1 var(--mono); color: var(--soft); }
  .addr div { padding-bottom: 9px; border-bottom: 1px solid var(--rule); display: flex; gap: 14px; }
  .addr span { color: var(--faint); min-width: 3.4em; }
  .addr em { font-style: normal; }
</style>
</head>
<body>
<div class="card">
  <div class="pic"><canvas id="pic"></canvas><div class="cap" id="cap"></div></div>
  <div class="split"></div>
  <div class="back">
    <div class="stamp"><div class="in"><canvas id="mini"></canvas><span class="city" id="stampCity"></span></div></div>
    <svg class="mark" viewBox="0 0 260 120" aria-hidden="true">
      <!-- the cancellation: wavy lines running left from a round date stamp -->
      <g fill="none" stroke="currentColor" stroke-width="2">
        <path d="M0 44 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
        <path d="M0 64 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
        <path d="M0 84 q10 -7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
        <circle cx="216" cy="64" r="60"/>
        <circle cx="216" cy="64" r="53" stroke-width="1"/>
      </g>
      <text id="pmCity" x="216" y="44" text-anchor="middle"></text>
      <text id="pmDay" class="day" x="216" y="69" text-anchor="middle"></text>
      <text id="pmTail" x="216" y="93" text-anchor="middle"></text>
    </svg>
    <div class="msg">
      <p class="cmd" id="cmd"></p>
      <h1 id="title"></h1>
      <p class="sum" id="sum"></p>
    </div>
    <div class="addr">
      <div><span>from</span><em id="addrFrom"></em></div>
      <div><span>at</span><em>laiyenju.github.io</em></div>
    </div>
  </div>
</div>

<script src="../../assets/js/sky.js"></script>
<script src="../../assets/js/pixel-engine.js"></script>
<script src="../../assets/js/scenes.js"></script>
<script>
  /* data: { title, summary, cmd, date ("YYYY-MM-DD", or empty for the home card) } */
  var CITY = siteSky.CITY;
  function two(n) { return (n < 10 ? '0' : '') + n; }
  // the building the home page shows on that day (day.js buildItems): home on a rest day, else the office
  function sceneFor(y, m, d) {
    var wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return wd === 0 || wd === 6 || HOLIDAYS[two(m) + '-' + two(d)] ? 'home' : 'studio';
  }
  // the building's own box inside a world's picture (the rest is its shadow)
  function inner(w) { return [w.pad[3], w.pad[0], w.view.width - w.pad[1] - w.pad[3], w.view.height - w.pad[0] - w.pad[2]]; }
  // the picture side: sized by the building alone, at a whole number of pixels per model pixel, centred on the
  // building; its shadow is drawn in full and may run to the edge of the picture side
  function paintPicture(cv, w, boxW, boxH, areaW, areaH) {
    var b = inner(w), k = Math.max(1, Math.floor(Math.min(boxW / b[2], boxH / b[3])));
    cv.width = w.view.width * k; cv.height = w.view.height * k;
    var g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(w.view, 0, 0, cv.width, cv.height);
    cv.style.left = Math.round(areaW * .46 - (b[0] + b[2] / 2) * k) + 'px'; // a little left: the shadow falls right
    cv.style.top = Math.round(areaH / 2 - 10 - (b[1] + b[3] / 2) * k) + 'px';
  }
  // the stamp: the building alone, made to fit (smoothed when it has to shrink)
  function paintStamp(cv, w, maxW, maxH) {
    var b = inner(w), k = Math.min(maxW / b[2], maxH / b[3]);
    k = k >= 1 ? Math.floor(k) : k;
    cv.width = Math.round(b[2] * k); cv.height = Math.round(b[3] * k);
    var g = cv.getContext('2d'); g.imageSmoothingEnabled = k < 1; g.drawImage(w.view, b[0], b[1], b[2], b[3], 0, 0, cv.width, cv.height);
  }
  window.render = async function (data) {
    var parts = (data.date || '').split('-').map(Number), y = parts[0], m = parts[1], d = parts[2];
    var scene = data.date ? sceneFor(y, m, d) : 'studio';
    // that afternoon's light in the city, so the shadow falls as it did; the card keeps the light of day
    var day = data.date ? Date.UTC(y, m - 1, d) : Date.UTC(2026, 9, 29);
    LIGHT = lightFor(day + (15.5 - CITY.tz) * 3600e3);
    var c = siteSky.colours(LIGHT.bg), root = document.documentElement.style;
    root.setProperty('--paper', c.bg); root.setProperty('--ink', c.ink); root.setProperty('--soft', c.soft);
    root.setProperty('--faint', c.faint); root.setProperty('--accent', c.accent); root.setProperty('--sheet', c.sheet);
    root.setProperty('--stamp', c.accent);

    var w = getWorld(scene, { notes: [1, 2, 3] }, 0, false);
    drawWorld(w, 1.3);
    paintPicture(document.getElementById('pic'), w, 470, 440, 620, 630);
    paintStamp(document.getElementById('mini'), w, 86, 82);
    document.getElementById('cap').textContent = (scene === 'home' ? 'Home' : 'The office') + ' · ' + CITY.name;

    document.getElementById('stampCity').textContent = CITY.name.toUpperCase();
    document.getElementById('addrFrom').textContent = 'yen@' + CITY.short;
    document.getElementById('pmCity').textContent = CITY.name.toUpperCase();
    document.getElementById('pmDay').textContent = data.date ? data.date.replace(/-/g, '.') : 'YEN LAI';
    document.getElementById('pmTail').textContent = data.date ? ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][new Date(day).getUTCDay()] : 'TAIWAN';

    var cmd = document.getElementById('cmd');
    cmd.innerHTML = '<i>$</i> ';
    cmd.appendChild(document.createTextNode(data.cmd));
    document.getElementById('title').textContent = data.title;
    document.getElementById('sum').textContent = data.summary;
    var all = data.title + data.summary + data.cmd;
    await Promise.all([
      document.fonts.load('700 40px "iA Writer Quattro"', data.title),
      document.fonts.load('700 40px "Noto Sans TC"', data.title),
      document.fonts.load('400 21px "iA Writer Quattro"', data.summary),
      document.fonts.load('400 21px "Noto Sans TC"', data.summary),
      document.fonts.load('400 18px "JetBrains Mono"', all + 'fromat'),
      document.fonts.load('600 16px "JetBrains Mono"', '0123456789.'),
    ]);
    await document.fonts.ready;
  };
</script>
</body>
</html>
