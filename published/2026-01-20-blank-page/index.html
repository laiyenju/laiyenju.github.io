              <p>假文佔位：用來看日期線、琥珀細線，以及返回箭頭在窄螢幕上的位置。<sup id="fnref:1"><a href="#fn:1" class="footnote" rel="footnote">1</a></sup></p>
              <h2>開始之前</h2>
              <p>再多兩段，讓預覽頁有真實的閱讀長度。安靜地，一頁紙就夠。</p>
              <p>空白不是空無，是等待下一句進來。</p>
