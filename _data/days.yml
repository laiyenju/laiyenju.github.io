# Places Yen has been. Each one is a building on the homepage (on the same month and day in later
# years) and a day in the timeline. A day can have more than one building. Under the building, each fact once:
#   when ("Seven years ago · January 22, 2019", from date), name, place (a map link), and one sentence:
#   "Yen {did}[ with {with}].[ {extra}]"
# So `did` says what happened, not when or where, and does not name the building again (the title does).
# Required: date ("YYYY-MM-DD", in quotes), scene (a model in assets/js/scenes.js SCENES), name,
#   zh (Chinese name; write no_zh: true to leave it out), place, did.
# Optional: with (a name, or a list), extra (one short sentence), coords ([latitude, longitude], shown on a
#   note's share card when the note is from this day),
#   map (search text for Google Maps), country (default "Japan").

