- slug: readwise-to-remarkable
  year: "2026"
  title: Readwise → reMarkable
  sub: reMarkable Hack series
  role: Design and build
  problem: Saved articles stayed in Readwise Reader. Reading them on the reMarkable 2 meant exporting files by hand every day.
  did: Yen built a nightly job on GitHub Actions. At 00:30 Taipei time it collects the tagged articles, turns them into EPUB or PDF with images, adds paragraph-by-paragraph translations, and makes a Daily Digest with its own cover. The files go to Google Drive, and the reMarkable syncs them.
  result: A new issue is on the reMarkable every morning. No computer needs to stay on.
- slug: design-lint
  year: "2026"
  title: Design Lint
  sub: A Figma plugin that checks designs against the design system
  role: Design and build
  problem: In-house designers and agencies drift from the design system, and checking a file by hand takes a long time.
  did: Yen designed and built a Figma plugin that checks components, color tokens, text styles, corner radius and text contrast (WCAG AA or AAA) against the approved library. Each finding jumps to its layer, and agencies need only view access to the library.
  result: In progress. The rules and automated tests are done; testing inside Figma is next.
