<script>
  // Day or night before first paint, so a visit never flashes the wrong ground:
  // a saved choice (theme: day / night, see theme.js), else the system setting.
  (function () {
    var p;
    try { p = localStorage.getItem("theme"); } catch (e) {}
    var night = p === "night" || (p !== "day" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (night) document.body.classList.add("theme-night");
  })();
</script>
<div class="theme-switch" role="radiogroup" aria-label="Theme 日夜">
  <button type="button" role="radio" aria-checked="true" data-theme-set="auto" title="跟隨系統">auto</button>
  <button type="button" role="radio" aria-checked="false" data-theme-set="day" title="日間">day</button>
  <button type="button" role="radio" aria-checked="false" data-theme-set="night" title="夜間">night</button>
</div>
